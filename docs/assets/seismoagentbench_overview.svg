<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">SeismoAgentBench project overview</title>
  <desc id="desc">Waveforms and scientific context enter an agentic catalog workflow, producing an earthquake catalog evaluated against expert references and operational baselines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#f7f3ff"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset="1" stop-color="#ffd88a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#263858" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .label { font: 600 17px Inter,Segoe UI,Arial,sans-serif; fill: #17324d; }
      .small { font: 400 14px Inter,Segoe UI,Arial,sans-serif; fill: #486176; }
      .tiny { font: 500 12px Inter,Segoe UI,Arial,sans-serif; fill: #617589; }
      .box { filter: url(#shadow); }
    </style>
  </defs>
  <rect width="1200" height="470" rx="28" fill="url(#bg)"/>
  <text x="60" y="54" class="tiny" letter-spacing="2.2">SEISMOAGENTBENCH  ·  AGENTIC SCIENTIFIC EVALUATION</text>
  <text x="60" y="93" style="font:700 30px Inter,Segoe UI,Arial,sans-serif;fill:#102a43">From seismic observations to a defensible catalog</text>

  <g class="box">
    <rect x="60" y="150" width="205" height="112" rx="18" fill="#e5f1ff" stroke="#3b82c4" stroke-width="2"/>
    <text x="84" y="186" class="label">Observations</text>
    <text x="84" y="213" class="small">Continuous waveforms</text>
    <text x="84" y="236" class="small">Stations · network context</text>
  </g>
  <g class="box">
    <rect x="320" y="122" width="300" height="168" rx="22" fill="url(#agent)" stroke="#d18a16" stroke-width="2.5"/>
    <text x="352" y="164" class="label">Agentic workflow</text>
    <text x="352" y="195" class="small">Picking → association</text>
    <text x="352" y="220" class="small">Location → relocation</text>
    <text x="352" y="253" class="tiny">Planning · tools · debugging · iteration</text>
  </g>
  <g class="box">
    <rect x="679" y="150" width="205" height="112" rx="18" fill="#e4f5e8" stroke="#3b9560" stroke-width="2"/>
    <text x="713" y="186" class="label">Output</text>
    <text x="713" y="213" class="small">Agent-generated</text>
    <text x="713" y="236" class="small">earthquake catalog</text>
  </g>
  <g class="box">
    <rect x="943" y="112" width="197" height="188" rx="20" fill="#f0e7fb" stroke="#8751ad" stroke-width="2"/>
    <text x="975" y="151" class="label">Evaluation</text>
    <text x="975" y="182" class="small">Detection</text>
    <text x="975" y="207" class="small">Association</text>
    <text x="975" y="232" class="small">Location</text>
    <text x="975" y="257" class="small">Uncertainty</text>
    <text x="975" y="282" class="small">Relative geometry</text>
  </g>

  <path d="M265 206 H310" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M620 206 H669" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M884 206 H933" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <g class="box">
    <rect x="320" y="350" width="300" height="66" rx="18" fill="#ffffff" stroke="#b6c5d6" stroke-width="1.5"/>
    <text x="350" y="378" class="label" style="font-size:15px">Scientific guidance</text>
    <text x="350" y="400" class="tiny">Open-ended · constrained · expert-assisted</text>
  </g>
  <g class="box">
    <rect x="679" y="350" width="461" height="66" rx="18" fill="#ffffff" stroke="#b6c5d6" stroke-width="1.5"/>
    <text x="710" y="378" class="label" style="font-size:15px">Reference layers</text>
    <text x="710" y="400" class="tiny">Verified expert catalogs  ·  official Q3 baselines</text>
  </g>
  <path d="M470 350 V300" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <path d="M850 350 V302" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
</svg>
