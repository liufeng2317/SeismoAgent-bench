# Discriminating experiment for "mixed" or pile-up verdicts after a velocity-model change: the same
# regional model as a linear gradient between its nodes. A pile-up that is an artefact of the step
# representation (events collecting at an interface) disappears; a model that is wrong stays wrong.
defaults:
  change: velocity_model
  stage: location
  pilot_events: 300
  pilots: [composite]
scenarios:
  - name: prague_tools_regional_linear
    case: 2011_prague_oklahoma
    run: tools/claude/glm-5.3/20261028T043719Z
    intervention: {type: relocate, model: keranen2013_prague_1d, datum_km: 0.28, layering: linear, usage: expert}
  - name: magna_tools_regional_linear
    case: 2020_magna_utah
    run: tools/claude/glm-5.3/20261028T135931Z
    intervention: {type: relocate, model: bjarnason_pechmann_1989_wasatch_front, datum_km: 1.48, layering: linear, usage: expert}
  - name: maple_tools_regional_linear
    case: 2017_maple_creek_yellowstone
    run: tools/claude/glm-5.3/20261028T220746Z
    intervention: {type: relocate, model: uuss_yellowstone_1d, datum_km: 2.3, layering: linear, usage: expert}
