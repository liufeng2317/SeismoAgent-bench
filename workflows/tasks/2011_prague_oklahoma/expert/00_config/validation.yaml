# Reference cohort mask, matching gates and review thresholds for
# 04_comparison/05_match_references.py and 01_pipeline/10_validate_catalog.py.
window:
  start_utc: '2011-11-11T00:00:00Z'
  end_utc: '2011-11-19T00:00:00Z'   # half-open, as everywhere in the pipeline
region:  # Cochran window envelope (35.45231-35.55757, -96.87233 to -96.73343) widened to 3 decimals
  latitude_bounds: [35.452, 35.558]
  longitude_bounds: [-96.873, -96.733]
# Reference depth datums are unstated (local surface ~0.28 km ASL); loose
# limits so that no datum convention removes events.
depth_bounds_km: [-3.0, 20.0]
# Hard gates in stage 05 (masked counts; see PLAN.md data preparation).
expected_reference_counts:
  cochran: 2078
  mcmahon: 2343
  isken: 6
  comcat: 11
matching:
  primary: [4.0, 15.0]           # Ridgecrest/Magna/Maple evaluation gates
  sensitivity: [[2.0, 5.0], [1.0, 3.0]]
  time_only: {primary: [1.0, 15.0], sensitivity: [], control_shift_s: 60}   # unused (no time-only reference)
quality:
  residual_outlier_s: 1.0
  association_review_min_outliers: 3
  association_review_fraction: 0.20
  rms_review_s: 0.6
  depth_sigma_review_km: 3.0
  horizontal_shift_review_km: 2.0
  depth_edge_km: 0.5
  azimuth_gap_review_deg: 180.0
references:  # paths relative to case_root
  cochran:
    label: Cochran et al. (2020) template-enhanced, relocated (primary)
    format: cochran_whitespace
    path: data/catalogs/COCHRAN2020_GJIGGAA153/COCHRAN2020_GJIGGAA153__catalog_primary.txt
  mcmahon:
    label: McMahon et al. (2017) subspace detection, Bayesloc
    format: mcmahon_release
    path: data/catalogs/MCMAHON2017_GL072944/raw/MCMAHON2017_GL072944__catalog_subspace_5446events.txt
  isken:
    label: Isken & Mooney (2017) Table S3, M>3 manual picks
    format: isken_csv
    path: data/catalogs/ISKEN2017_BSSA0120160150/ISKEN2017_BSSA0120160150__catalog_relocated_tableS3.csv
    # origin times are given to the minute only: a location anchor, matched
    # within 60 s / 5 km and never read as a recall measure
    gates: {primary: [60.0, 5.0], sensitivity: []}
  comcat:
    label: ComCat operational (us, M>=1.6 in the window)
    format: comcat_csv
    path: data/catalogs/USGS_TUL_COMCAT_2011/USGS_TUL_COMCAT_2011__catalog_operational_benchmark.csv
