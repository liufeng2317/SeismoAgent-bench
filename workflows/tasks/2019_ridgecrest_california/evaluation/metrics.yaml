# Pre-registered catalog metrics, v2 (docs/framework/02_Catalog_Metrics.md) for Ridgecrest 2019.
# Scored with: python -m SeismoAgentBench.scoring.catalog_metrics {baseline,run} --task-dir <this task>
metrics_version: 2
references_loader: adapter          # evaluation/metrics_adapter.py (audited five-source loader)
mask:                               # analysis/processing.yaml candidate window and native bounds
  start_utc: '2019-07-04T00:00:00Z'
  end_utc: '2019-07-07T00:00:00Z'
  latitude: [35.45, 36.05]
  longitude: [-117.90, -117.20]
  depth_bsl_km: [-0.7, 19.3]        # [0, 20] below the nominal 0.7-km surface
development_window:                 # fast development loop (dev_* variants, 2026-11-07): mainshock -2 h to +22 h
  start_utc: '2019-07-06T01:19:00Z'
  end_utc: '2019-07-07T00:00:00Z'
  anchor: 'Mw 7.1 2019-07-06T03:19:53Z; end cut at the end of the data window'
surface_elevation_km: 0.7           # expert association.yaml reference_elevation_km
off_structure_km: 1.0
primary: {detection: shelly, location: shelly, magnitude: official_earthquake}
references:
  # Datums are not harmonised across sources; compared as below-surface depths (expert convention).
  shelly: {roles: DLSM, depth_datum: surface}             # template matching; primary
  liu: {roles: DLS, depth_datum: surface}                 # ML picker + GaMMA, relocated
  ross_relocated: {roles: DLS, depth_datum: surface}      # QTM relocated subset
  awr_hypocenters: {roles: D, depth_datum: surface}       # long-term GaMMA
  official_earthquake: {roles: DLM, depth_datum: surface} # ComCat (SCSN) operational
expert:
  final: {path: expert/export/68_cc_relocation/60_catalog/catalog_events.csv, time_column: origin_time_utc,
          depth_column: depth_bsl_km, depth_datum: sea_level}
  blind: {path: expert/export/01_baseline/04_locate_nonlinloc/full/events.csv, time_column: origin_time,
          depth_column: depth_below_sea_level_km, depth_datum: sea_level, keep: {status: LOCATED}}
leakage_patterns:
  - '10\.1785/0220190309'
  - '10\.1029/2019GL086189'
  - '10\.1126/science\.aaz0109'
  - '10\.1093/gji/ggaf001'
  - '10\.22002/5af05-cah73'
  - '10\.22002/f40da-hww21'
  - '10\.5066/P9JN6H0N'
  - 'data/\d{4}_[a-z_]+/(data/catalogs|references|analysis)/'   # repository reference data
  - 'tasks/\d{4}_[a-z_]+/(expert|evaluation)/'                  # expert catalogs and scores
  - 'fdsnws/event'
  - 'isc\.ac\.uk/(iscbulletin|cgi-bin|dataset_repository)|seismicportal\.eu|doi\.org/10\.31905/'   # ISC bulletin and dataset repository
  - 'earthquake\.usgs\.gov/(earthquakes|fdsnws)'
  - 'scedc\.caltech\.edu/(eq-catalogs|data/cat)'

# Accesses listed for a manual check; they do not set the leakage flag (scoring/catalog_metrics/process.py).
leakage_review_patterns:
  - '(scedc\.caltech\.edu|ncedc\.org|quake\.utah\.edu|ou\.edu/ogs|geonet\.org\.nz|zenodo\.org|datadryad\.org|sciencebase\.gov|igppweb\.ucsd\.edu/~shearer)/'   # hosts of catalogues: read for a model, or downloaded?
  - 'https?://[^\s"]*(ridgecrest|searles)'   # a URL naming the sequence (paper, catalogue, data product)
