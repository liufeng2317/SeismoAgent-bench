# Pre-registered catalog metrics, v2 (docs/framework/02_Catalog_Metrics.md) for Magna 2020.
# Scored with: python -m SeismoAgentBench.scoring.catalog_metrics {baseline,run} --task-dir <this task>
metrics_version: 2
references_loader: stage05          # expert/04_comparison/05_match_references.py + validation.yaml gates
mask:                               # expert/00_config/validation.yaml (sea-level depth bounds)
  start_utc: '2020-03-18T00:00:00Z'
  end_utc: '2020-03-26T00:00:00Z'
  latitude: [40.69, 40.84]
  longitude: [-112.14, -111.94]
  depth_bsl_km: [-1.3, 13.1]
surface_elevation_km: 1.48          # expert association.yaml reference_elevation_km
off_structure_km: 1.0
primary: {detection: pang, location: pang, magnitude: uuss}
references:
  pang: {roles: DLSM, depth_datum: sea_level}         # relocated; Mc sentinels parsed to NaN
  baker: {roles: DS, depth_datum: unknown}            # picks collapsed to events; datum unspecified
  uuss: {roles: DLM, depth_datum: sea_level}          # operational
pick_reference:                     # L5 (§5): reference phase picks, relative to data/<case>/
  key: baker
  format: baker_csv
  path: data/catalogs/BAKER2021_0220200316/BAKER2021_0220200316__catalog_picks.csv
expert:
  final: {path: expert/export/r11/60_catalog/catalog_events.csv, time_column: origin_time_utc,
          depth_column: depth_bsl_km, depth_datum: sea_level,
          picks: expert/export/r8/03_associate_gamma/full/picks.csv}
  blind: {path: expert/export/r1/04_locate_nonlinloc/full/events.csv, time_column: origin_time,
          depth_column: depth_below_sea_level_km, depth_datum: sea_level, keep: {status: LOCATED}}
leakage_patterns:
  - '10\.1029/2020GL089798'
  - '10\.1785/0220200316'
  - '10\.31905/9IE6PAF2'
  - '10\.31905/LGR1456Y'
  - 'data/\d{4}_[a-z_]+/(data/catalogs|references|analysis)/'   # repository reference data
  - 'tasks/\d{4}_[a-z_]+/(expert|evaluation)/'                  # expert catalogs and scores
  - 'fdsnws/event'
  - 'isc\.ac\.uk/(iscbulletin|cgi-bin|dataset_repository)|seismicportal\.eu|doi\.org/10\.31905/'   # ISC bulletin and dataset repository
  - 'earthquake\.usgs\.gov/(earthquakes|fdsnws)'
  - 'quake\.utah\.edu/[^\s"]*catalog'   # UUSS catalogues

# Accesses listed for a manual check; they do not set the leakage flag (scoring/catalog_metrics/process.py).
leakage_review_patterns:
  - '(scedc\.caltech\.edu|ncedc\.org|quake\.utah\.edu|ou\.edu/ogs|geonet\.org\.nz|zenodo\.org|datadryad\.org|sciencebase\.gov|igppweb\.ucsd\.edu/~shearer)/'   # hosts of catalogues: read for a model, or downloaded?
  - 'https?://[^\s"]*(magna)'   # a URL naming the sequence (paper, catalogue, data product)
