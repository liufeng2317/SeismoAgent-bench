# Pre-registered catalog metrics, v2 (docs/framework/02_Catalog_Metrics.md) for Kaikōura 2016.
# Scored with: python -m SeismoAgentBench.scoring.catalog_metrics {baseline,run} --task-dir <this task>
metrics_version: 2
references_loader: stage05          # expert/04_comparison/05_match_references.py + validation.yaml gates
mask:                               # expert/00_config/validation.yaml (model datum 0 km = sea level)
  start_utc: '2016-12-01T00:00:00Z'
  end_utc: '2016-12-09T00:00:00Z'
  latitude: [-43.5, -41.2]
  longitude: [172.0, 175.2]
  depth_bsl_km: [-3.0, 60.0]
development_window:                 # fast development loop (dev_* variants, 2026-11-07): mainshock -2 h to +22 h
  start_utc: '2016-12-04T01:15:00Z'
  end_utc: '2016-12-05T01:15:00Z'
  anchor: 'M 5.5 2016-12-04T03:15:47Z (GeoNet 2016p913880, largest event of the window)'
surface_elevation_km: 0.0           # expert association.yaml reference_elevation_km
off_structure_km: 5.0               # sparse network and 1-D vs 3-D frame offsets of 3-4 km
primary_gates: [4.0, 15.0]          # v2 default is 2 s / 5 km; the 260-km network and 1-D vs 3-D frame offsets (final scatter 1.9 km) keep the wider gates
primary: {detection: chamberlain, location: lanza, magnitude: geonet}   # Tan has no comparably complete partner (ceiling 0.16)
references:
  tan: {roles: DSM, depth_datum: sea_level}
  lanza: {roles: LS, depth_datum: sea_level}          # 122 HypoDD origins
  chamberlain: {roles: DSM, depth_datum: sea_level}   # corrected GrowClust, 3-D frame
  geonet: {roles: DM, depth_datum: sea_level}         # operational; fixed-depth solutions -> no L
expert:
  final: {path: expert/export/r9/60_catalog/catalog_events.csv, time_column: origin_time_utc,
          depth_column: depth_bsl_km, depth_datum: sea_level}
  blind: {path: expert/export/r1/04_locate_nonlinloc/full/events.csv, time_column: origin_time,
          depth_column: depth_below_sea_level_km, depth_datum: sea_level, keep: {status: LOCATED}}
leakage_patterns:
  - '10\.1029/2019GL082780'
  - '10\.1029/2021JB022304'
  - '10\.1029/2024JB028735'
  - '10\.5281/zenodo\.10937462'
  - 'data/\d{4}_[a-z_]+/(data/catalogs|references|analysis)/'   # repository reference data
  - 'tasks/\d{4}_[a-z_]+/(expert|evaluation)/'                  # expert catalogs and scores
  - 'fdsnws/event'
  - 'isc\.ac\.uk/(iscbulletin|cgi-bin|dataset_repository)|seismicportal\.eu|doi\.org/10\.31905/'   # ISC bulletin and dataset repository
  - 'quakesearch\.geonet|api\.geonet\.org\.nz/quake|wfs\.geonet\.org\.nz'

# Accesses listed for a manual check; they do not set the leakage flag (scoring/catalog_metrics/process.py).
leakage_review_patterns:
  - '(scedc\.caltech\.edu|ncedc\.org|quake\.utah\.edu|ou\.edu/ogs|geonet\.org\.nz|zenodo\.org|datadryad\.org|sciencebase\.gov|igppweb\.ucsd\.edu/~shearer)/'   # hosts of catalogues: read for a model, or downloaded?
  - 'https?://[^\s"]*(kaikoura|kaik%C5%8Dura|kaikōura)'   # a URL naming the sequence (paper, catalogue, data product)
