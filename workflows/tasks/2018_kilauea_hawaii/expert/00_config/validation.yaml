# Reference cohort mask, matching gates and review thresholds for
# 04_comparison/05_match_references.py and 01_pipeline/10_validate_catalog.py.
window:
  start_utc: '2018-05-01T00:00:00Z'
  end_utc: '2018-05-09T00:00:00Z'   # half-open, as everywhere in the pipeline
region:  # the frozen summit box (analysis/KILAUEA2018_analysis.md)
  latitude_bounds: [19.30, 19.50]
  longitude_bounds: [-155.40, -155.15]
# Reference depth datums are unstated/mixed; loose limits (the analysis audit
# used 0-20 km) so that no datum convention removes events.
depth_bounds_km: [-3.0, 20.0]
expected_reference_counts:  # hard gates in stage 05
  shelly: 1902
  wei: 3627
  matoza: 1020
  comcat: 496
matching:
  primary: [4.0, 15.0]           # Ridgecrest/Magna/Maple/Prague evaluation gates
  sensitivity: [[2.0, 5.0], [1.0, 3.0]]
  time_only: {primary: [1.0, 15.0], sensitivity: [], control_shift_s: 60}   # unused (no time-only reference)
quality:
  residual_outlier_s: 1.0
  association_review_min_outliers: 3
  association_review_fraction: 0.20
  rms_review_s: 0.6
  depth_sigma_review_km: 3.0
  horizontal_shift_review_km: 2.0
  depth_edge_km: 0.5
  azimuth_gap_review_deg: 180.0
references:  # paths relative to case_root
  shelly:
    label: Shelly & Thelen (2019) data S1 hypocentroids (primary)
    format: shelly_s1
    path: data/catalogs/SHELLY2019_GL085636/SHELLY2019_GL085636__catalog_S1.txt
  wei:
    label: Wei et al. (2022) data S1 (3-D NonLinLoc)
    format: wei_s1
    path: data/catalogs/WEI2022_EA001979/WEI2022_EA001979__catalog_S1.txt
  matoza:
    label: Matoza et al. (2021) GrowClust relocations (nbranch > 1)
    format: matoza_growclust
    path: data/catalogs/MATOZA2021_EA001253/MATOZA2021_EA001253__catalog_islandwide.txt
  comcat:
    label: ComCat/HVO operational
    format: comcat_csv
    path: data/catalogs/USGS_HVO_COMCAT_2018/USGS_HVO_COMCAT_2018__catalog_operational_benchmark.csv
