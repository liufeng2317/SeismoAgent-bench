schema_version: 2
case_id: 2019_ridgecrest_california
window_status: not_frozen
scientific_design:
  status: candidate_design_reference_audit_only
  primary_question: Can an agent construct a usable earthquake catalog from identical observations across
    low-rate and mainshock-coda conditions?
  candidate_window:
    start_utc: '2019-07-04T00:00:00Z'
    end_utc: '2019-07-07T00:00:00Z'
    interval: half_open
    native_comparison_bounds:
      latitude:
      - 35.45
      - 36.05
      longitude:
      - -117.9
      - -117.2
      depth_km:
      - 0
      - 20
    status: exploratory_legacy_mask_not_scientific_freeze
    depth_datum_harmonized: false
  anchor_event_ids:
    mw6_4: ci38443183
    mw7_1: ci38457511
  primary_input_condition: raw_waveforms_and_station_metadata
  separate_assisted_conditions:
  - routine_catalog_assisted
  - phase_assisted
  guidance_conditions:
  - closed_reference
  - open_literature_sanitized
  - expert_guided
  station_policy: permanent_network_candidate; station/channel availability not yet verified
  reference_policy:
    detection: Shelly with Liu and earthquake-only SCSN cross-checks; no universal truth set
    relative_geometry: Shelly and Ross nbranch>1; compare matched-event geometry
    absolute_location: reference differences only until depth datums and uncertainty are checked
    moment_tensors: AWR auxiliary, outside initial catalog-construction task
  hidden_materials:
  - target_event_catalogs
  - target_phase_tables
  - extraction_answers
  - reference_audit_outputs
  freeze_gates:
  - reference_roles_reviewed
  - depth_datums_resolved
  - matching_thresholds_calibrated_on_development_only
  - station_day_channel_availability_verified
  - input_information_boundary_enforced
  - development_evaluation_split_defined
reference_audit:
  overlap_diagnostic:
    method: reciprocal_unique_candidates_only
    formal_scoring: false
    time_tolerances_s:
    - 0.5
    - 1.0
    - 2.0
    horizontal_tolerances_km:
    - 2.0
    - 5.0
    pairs:
    - - shelly
      - liu
    - - shelly
      - ross_relocated
    - - shelly
      - official_earthquake
    - - liu
      - official_earthquake
  event_sources:
  - shelly
  - liu
  - ross
  - awr_hypocenters
  - awr_moment_tensors
  - official_full
  - official_snapshot
  phase_source: shelly_phase_arrivals
  anchor_source: official_snapshot
  stage_names:
  - before_mw6_4
  - first_hour_after_mw6_4
  - later_between_large_events
  - first_hour_after_mw7_1
  - later_after_mw7_1
  stage_boundaries:
  - anchor: window_start
  - anchor: mw6_4
  - anchor: mw6_4
    offset_s: 3600
  - anchor: mw7_1
  - anchor: mw7_1
    offset_s: 3600
  - anchor: window_end
  subsets:
    ross_relocated:
      source: ross
      field: nbranch
      operator: gt
      value: 1
    official_earthquake:
      source: official_snapshot
      field: event_type
      operator: eq
      value: earthquake
source_groups:
  AWR2025_CALTECHDATA:
    role: long_term_methodological_auxiliary
    interpretation: retain gamma magnitude separately; compare release counts with article counts
    readme: data/catalogs/AWR2025_CALTECHDATA/README.md
  LIU2020_GL086189:
    role: independent_relocated_event_reference
    interpretation: origin-time tuple is the native reproducibility key; no supplied event ID
    readme: data/catalogs/LIU2020_GL086189/README.md
  ROSS2019_SCIENCE:
    role: relative_relocation_reference
    interpretation: retain all rows but expose nbranch_gt_1 as the metric-specific relocated subset
    readme: data/catalogs/ROSS2019_SCIENCE/README.md
  SHELLY2020_0220190309:
    role: matched_filter_event_reference
    interpretation: phase arrivals are auxiliary pick-level data, not events
    readme: data/catalogs/SHELLY2020_0220190309/README.md
  USGS_SCSN_COMCAT_2019:
    role: official_operational_baseline
    interpretation: preserve source-native magnitude, event type, and the original official snapshot filename
    readme: data/catalogs/USGS_SCSN_COMCAT_2019/README.md
sources:
  shelly:
    path: data/catalogs/SHELLY2020_0220190309/raw_article/SHELLY2020_0220190309__catalog_DataS1.txt
