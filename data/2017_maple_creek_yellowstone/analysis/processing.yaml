schema_version: 1
case_id: 2017_maple_creek_yellowstone
role: case-level catalog-processing manifest
runtime_note: Declarative provenance record; catalog-local scripts remain the execution
  entry points.
processing_policy:
  plot_profile: minimal
  figure_format: png
  figure_dpi: 300
window_status: frozen
window_freeze:
  frozen_on: '2026-10-28'
  authority: metrics v1 (docs/framework/02_Catalog_Metrics.md); the evaluation cohort mask (time, region, depth) is workflows/tasks/2017_maple_creek_yellowstone/expert/00_config/validation.yaml
  evaluation_window:
    start_utc: '2017-06-11T00:00:00Z'
    end_utc: '2017-06-19T00:00:00Z'
    interval: half_open
scientific_design:
  status: frozen_2026-10-28_metrics_v1
  primary_question: Can an agent detect and locate a Yellowstone swarm under a mixed
    permanent/temporary network with template-lineage references?
  candidate_window:
    start_utc: '2017-06-11T00:00:00Z'
    end_utc: '2017-06-19T00:00:00Z'
    interval: half_open
    status: frozen_2026-10-28_metrics_v1
    source: analysis/MAPLE2017_analysis.md v1 benchmark window, frozen with metrics
      v1 on 2026-10-28
  primary_input_condition: raw_waveforms_and_station_metadata
  station_policy: shelly_phase_manifest_candidate; 27 network-station pairs selected
    by the phase release inside the window; channel/location availability verified
    against EarthScope metadata, waveform availability not presumed
catalogs:
- source_ref: SHELLY2019_GL081607
  catalog_dir: data/catalogs/SHELLY2019_GL081607
  parser_version: maple-local-v1-compact
  script: data/catalogs/SHELLY2019_GL081607/workflows/data_preparation/run_catalog_analysis.py
  products:
  - product_id: phase_arrivals
    kind: phase_csv
    unit: phase_pick
    role: primary_auxiliary
    source_path: raw/Yellowstone_2017_correlation_phase_arrivals.csv
  - product_id: detection_events
    kind: derived_csv
    unit: event
    role: primary_time_only_reference
    script: data/catalogs/SHELLY2019_GL081607/scripts/derive_detection_events.py
    source_path: analysis/derived/detection_events/SHELLY2019_GL081607__detection_events_v1.csv
- source_ref: USGS_UUSS_COMCAT_2017
  catalog_dir: data/catalogs/USGS_UUSS_COMCAT_2017
  parser_version: maple-local-v1-compact
  script: data/catalogs/USGS_UUSS_COMCAT_2017/workflows/data_preparation/run_catalog_analysis.py
  products:
  - product_id: operational_full
    kind: usgs_csv
    unit: event
    role: baseline
    source_path: USGS_UUSS_COMCAT_2017__catalog_operational_full.csv
  - product_id: operational_benchmark
    kind: usgs_csv
    unit: event
    role: baseline
    source_path: USGS_UUSS_COMCAT_2017__catalog_operational_benchmark.csv
