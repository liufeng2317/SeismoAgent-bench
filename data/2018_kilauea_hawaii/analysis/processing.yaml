schema_version: 1
case_id: 2018_kilauea_hawaii
role: case-level catalog-processing manifest
runtime_note: Declarative provenance record; catalog-local scripts remain the execution
  entry points.
processing_policy:
  plot_profile: minimal
  figure_format: png
  figure_dpi: 300
window_status: frozen
window_freeze:
  frozen_on: '2026-10-28'
  authority: metrics v1 (docs/framework/02_Catalog_Metrics.md); the evaluation cohort mask (time, region, depth) is workflows/tasks/2018_kilauea_hawaii/expert/00_config/validation.yaml
  evaluation_window:
    start_utc: '2018-05-01T00:00:00Z'
    end_utc: '2018-05-09T00:00:00Z'
    interval: half_open
scientific_design:
  status: frozen_2026-10-28_metrics_v1
  primary_question: Can an agent sustain detection and monitoring through an
    eruption-onset sequence with extremely high event rates and a network whose
    availability degrades day by day (station loss after the M6.9 flank event
    and summit collapses)?
  candidate_window:
    start_utc: '2018-05-01T00:00:00Z'
    end_utc: '2018-05-09T00:00:00Z'
    interval: half_open
    status: frozen_2026-10-28_metrics_v1
    source: 8-day recommended compact window for eruption-onset/high-rate
      monitoring (analysis/KILAUEA2018_analysis.md); summit scope paired with
      the Shelly & Thelen (2019) reference; the full reference span
      (2018-04-29 to 2018-08-06) remains a separate large-volume option.
  primary_input_condition: raw_waveforms_and_station_metadata
  station_policy: shelly_phase_manifest_with_day_level_availability_audit;
    stations come from the phase-pick release inside the candidate window,
    and a dataselect probe audits per-station/per-day waveform presence
    because eruption damage changes availability within the window.
catalogs:
- source_ref: LENGLINE2021_EPSL116653
  catalog_dir: data/catalogs/LENGLINE2021_EPSL116653
  parser_version: kilauea-local-v2-compact
  script: data/catalogs/LENGLINE2021_EPSL116653/workflows/data_preparation/run_catalog_analysis.py
  products:
  - product_id: relative_events
    kind: lengline
    unit: relative_event
    role: auxiliary
    source_path: raw/loc_events.txt
- source_ref: MATOZA2014_GL059819
  catalog_dir: data/catalogs/MATOZA2014_GL059819
  parser_version: kilauea-local-v2-compact
  script: data/catalogs/MATOZA2014_GL059819/workflows/data_preparation/run_catalog_analysis.py
