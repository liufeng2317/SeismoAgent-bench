schema_version: 1
case_id: 2011_prague_oklahoma
role: case-level catalog-processing manifest
runtime_note: Declarative provenance record; catalog-local scripts remain the execution
  entry points.
processing_policy:
  plot_profile: minimal
  figure_format: png
  figure_dpi: 300
window_status: frozen
window_freeze:
  frozen_on: '2026-10-28'
  authority: metrics v1 (docs/framework/03_EVALUATION_METRICS.md); the evaluation cohort mask (time, region, depth) is workflows/tasks/2011_prague_oklahoma/expert/00_config/validation.yaml
  evaluation_window:
    start_utc: '2011-11-11T00:00:00Z'
    end_utc: '2011-11-19T00:00:00Z'
    interval: half_open
scientific_design:
  status: frozen_2026-10-28_metrics_v1
  primary_question: Can an agent sustain detection, association and location
    quality through an induced aftershock sequence recorded by a mixed
    RAMP/USArray/permanent network whose geometry changes during deployment?
  candidate_window:
    start_utc: '2011-11-11T00:00:00Z'
    end_utc: '2011-11-19T00:00:00Z'
    interval: half_open
    status: frozen_2026-10-28_metrics_v1
    source: v1 core window (analysis/PRAGUE2011_analysis.md) chosen because the
      last temporary stations became fully operational on 2011-11-11; the
      changing-network interval 2011-11-04 to 11-11 remains a separate stress
      condition and must not be mixed into the core score.
  primary_input_condition: raw_waveforms_and_station_metadata
  station_policy: mcmahon_31_station_reconstruction; the paper's 31-station set
    (18 Oklahoma RAMP ZQ LC01-LC18 + 3 USGS GS OK020-OK022 + 9 Transportable
    Array TA + 1 Oklahoma network OK FNO) is rebuilt by rule because Table S1
    is not retrievable (publisher supplement blocked). TA membership is the
    nine stations nearest the Mw 5.7 mainshock epicentre (cut at 129 km; the
    tenth candidate sits at 134 km), cross-checked against McMahon phase
    participation. All waveforms and StationXML come from EarthScope.
catalogs:
- source_ref: COCHRAN2020_GJIGGAA153
  catalog_dir: data/catalogs/COCHRAN2020_GJIGGAA153
  parser_version: prague-local-v1-compact
  script: data/catalogs/COCHRAN2020_GJIGGAA153/workflows/data_preparation/run_catalog_analysis.py
  products:
  - product_id: events_primary
    kind: cochran_event
    unit: event
    role: primary
    source_path: COCHRAN2020_GJIGGAA153__catalog_primary.txt
- source_ref: ISKEN2017_BSSA0120160150
  catalog_dir: data/catalogs/ISKEN2017_BSSA0120160150
  parser_version: prague-local-v1-compact
  script: data/catalogs/ISKEN2017_BSSA0120160150/workflows/data_preparation/run_catalog_analysis.py
  products:
  - product_id: events_relocated
    kind: isken_event
    unit: event
    role: structural_anchor
    source_path: ISKEN2017_BSSA0120160150__catalog_relocated_tableS3.csv
- source_ref: MCMAHON2017_GL072944
  catalog_dir: data/catalogs/MCMAHON2017_GL072944
  parser_version: prague-local-v1-compact
  script: data/catalogs/MCMAHON2017_GL072944/workflows/data_preparation/run_catalog_analysis.py
  products:
  - product_id: events_subspace
    kind: mcmahon_event
    unit: event
