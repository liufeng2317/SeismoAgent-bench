    source_path: raw/MCMAHON2017_GL072944__catalog_subspace_5446events.txt
  - product_id: phase_arrivals
    kind: mcmahon_phase
    unit: phase_pick
    role: auxiliary
    source_path: raw/MCMAHON2017_GL072944__catalog_subspace_5446events.txt
- source_ref: USGS_TUL_COMCAT_2011
