[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matchlocate-runner"
version = "0.1.0"
description = "Dataset preparation, native job orchestration and merging for MatchLocate2 (Match&Locate)."
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
prepare = ["obspy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["matchlocate_runner*"]
