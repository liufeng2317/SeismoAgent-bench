[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hypodd-runner"
version = "0.1.0"
description = "Programmatic HypoDD/ph2dt runner with optional FDTCC cross-correlation."
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["."]
include = ["hypodd_runner*"]

[tool.setuptools.package-data]
hypodd_runner = ["template/*.inp", "template/*.json"]
